# =============================================================================
# SIH 26126 — Class Mapping Configuration
# =============================================================================
#
# Maps raw RELLIS-3D semantic label IDs to our 6 navigation classes.
#
# These are PROJECT-LEVEL ENGINEERING DECISIONS, not claims about the
# original RELLIS-3D ontology or ground-truth traversability.
#
# Source of truth:
#   - RELLIS ontology: data/rellis3d/benchmarks/SalsaNext/train/tasks/semantic/config/labels/rellis.yaml
#   - Official label_convert.py: data/rellis3d/utils/label_convert.py
#   - Pixel-level verification across sequences 00000–00004
#
# Created: 2026-09-25
# =============================================================================

dataset:
  name: rellis3d
  sequences_verified: ["00000", "00001", "00002", "00003", "00004"]
  total_paired_samples: 6234
  notes: >
    Training samples are defined as valid RGB + semantic mask pairs.
    Not every RGB frame has a corresponding annotation.

# ---------------------------------------------------------------------------
# Navigation classes (our 6-class taxonomy)
# ---------------------------------------------------------------------------
navigation_classes:
  0: SMOOTH      # Safe, paved/hard driveable surface
  1: ROUGH       # Traversable natural terrain, uneven but firm
  2: BUMPY       # Traversable with difficulty, risk, or discomfort
  3: FORBIDDEN   # Non-traversable terrain (not a solid object)
  4: OBSTACLE    # Solid physical obstacle — must not drive into
  5: BACKGROUND  # Not part of the navigable ground scene

# ---------------------------------------------------------------------------
# Source class mapping: raw RELLIS ID → navigation class
# ---------------------------------------------------------------------------
# "observed" indicates whether this ID was found in our 5 sequences.
# IDs 29, 30, 32 are from the official label_convert.py but were NOT
# observed in our data. They are included defensively.
# ---------------------------------------------------------------------------
