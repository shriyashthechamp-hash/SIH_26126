# ---------------------------------------------------------------------------
# Unmapped / unknown handling
# ---------------------------------------------------------------------------
unknown_handling:
  strategy: "map_to_background"
  navigation_id: 5
  rationale: >
    Any raw label ID not listed in source_classes is treated as BACKGROUND (5).
    This is a conservative safety decision — unknown terrain is not assumed
    traversable.

