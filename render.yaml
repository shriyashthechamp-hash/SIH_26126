services:
  - type: web
    name: drishti-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn src.server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ALLOWED_ORIGINS
        value: https://sih-26126.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: MODEL_CHECKPOINT_PATH
        value: experiments/rellis_segformer_b0_baseline/best_model.pt
